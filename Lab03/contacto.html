    <main>
    <h1>Contacto</h1>
            
  <form class="contact-form">
    <fieldset class="custom-fieldset">
    <legend class="custom-legend">Datos de Contacto</legend>

    <!-- Fila 1: Nombre y Correo en 2 columnas paralelas -->
    <div class="form-row-2col">
      <div class="form-field">
        <label class="form-label" for="name">Nombre Completo:</label>
        <input class="form-control" type="text" id="name" name="name" required placeholder="Tu nombre">
      </div>

      <div class="form-field">
        <label class="form-label" for="email">Correo Electrónico:</label>
        <input class="form-control" type="email" id="email" name="email" required placeholder="correo@ejemplo.com">
      </div>
    </div>
      <div class="form-field">
        <label class="form-label" for="Consulta">Mensaje o comentario:</label>
        <input class="form-control" type="text" id="Consulta" name="Consulta" required placeholder="">
      </div>
    </div>

    <!-- Fila 2: Teléfono y Botón de Enviar -->
     
    <div class="form-row-bottom">
      <div class="form-field">
        <label class="form-label" for="phone">Número Telefónico:</label>
        <input class="form-control" type="tel" id="phone" name="phone" required placeholder="8888-8888">
      </div>
      
      <div class="form-field form-field-button">
        <button class="btn-contacto" type="submit">Enviar Contacto</button>
      </div>

      
    </div>
  </fieldset>
</form>

      
   
</div>
  </main>
</body>
</html>
