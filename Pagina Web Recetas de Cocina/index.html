  <link rel="stylesheet" href="estilos.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
  <!-- Encabezado de la página -->
  <header>
    <h1 id="main-title" class="title">Sabor & Arte</h1>
    <h2 class="title">GastroLab</h2>
    <!-- Menú de navegación tradicional apuntando a los archivos .html -->
    <nav class="nav-menu">
      <ul class="nav-list">
        <li class="menu-item"><a href="index.html">Registrarte Ahora</a></li>
        <li class="menu-item"><a href="explorar_receta.html">Explorar Recetas</a></li>
        <li class="menu-item"><a href="crear_receta.html">Crear Receta</a></li>
        <li class="menu-item"><a href="recetas_favoritas.html">Mis Favoritas</a></li>
        <li class="menu-item"><a href="comunidad.html">Comunidad</a></li>
      </ul>
    </nav>
  </header>

  <!-- Cuerpo de la página -->
  <main class="container">

    <!-- Bloque de formulario de registro de usuario con Rol -->
    <section class="card p-4 mx-auto my-4">
      <form action="crearUsuario.php" method="post">
        <fieldset>
          <legend>Iniciemos con tu registro</legend>

          <div class="form-group">
            <label class="form-label" for="username">Nombre Completo:</label>
            <input class="form-control" type="text" id="username" name="username" required placeholder="Tu nombre Completo">

            <label class="form-label" for="email">Correo Electrónico:</label>
            <input class="form-control" type="email" id="email" name="email" required placeholder="correo@ejemplo.com">

            <label class="form-label" for="password">Contraseña:</label>
            <input class="form-control" type="password" id="password" name="password" required placeholder="******">
          </div>

          <!-- Definición de Rol de Usuario -->
          <fieldset class="my-3">
            <legend>Seleccione su perfil</legend>
            <div class="form-group">
              <select class="form-control" id="rol" name="rol" required>
                <option value="">Seleccione un Perfil</option>
                <option value="Cocinero">Creador (Publica Recetas)</option>
                <option value="Visitante">Visitante (Explora y Guarda)</option>
                <option value="Administrador">Administrador del Sistema</option>
              </select>
            </div>
          </fieldset>

          <fieldset class="my-3">
            <legend>Género</legend>
            <div>
              <div>
                <input type="radio" value="m" name="genero" id="g-m">
                <label for="g-m">Masculino</label>
              </div>
              <div>
                <input type="radio" value="f" name="genero" id="g-f">
                <label for="g-f">Femenino</label>
              </div>
              <div>
                <input type="radio" value="o" name="genero" id="g-o">
                <label for="g-o">Otro</label>
              </div>
              <div>
                <input type="radio" value="n" name="genero" id="g-n">
                <label for="g-n">Prefiero no Responder</label>
              </div>
            </div>
          </fieldset>

          <fieldset class="my-3">
            <legend>Seleccione sus Categorías de Interés:</legend>
            <div>
              <div>
                <input type="checkbox" name="intereses" id="interes1" value="postres">
                <label for="interes1">Repostería y Postres</label>
              </div>
              <div>
                <input type="checkbox" name="intereses" id="interes2" value="saludable">
                <label for="interes2">Comida Saludable / Fitness</label>
              </div>
              <div>
                <input type="checkbox" name="intereses" id="interes3" value="rapida">
                <label for="interes3">Cenas Rápidas o Snacks</label>
              </div>
              <div>
                <input type="checkbox" name="intereses" id="interes4" value="internacional">
                <label for="interes4">Cocina Internacional</label>
              </div>
            </div>
          </fieldset>

          <button class="btn btn-primary w-100 my-2" type="submit">Registrar Usuario</button>
        </fieldset>
      </form>
    </section>

    <!-- Bloque de video incrustado -->
    <section id="video-section">
      <!-- Bloque de video incrustado -->
<section id="video-section">
  <iframe width="560" height="315" src="https://www.youtube.com/embed/ZRQeBKTbzYk?start=3" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
    </section>
  </main>

  <!-- Pie de página -->

</body>
</html>
